<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qzr</title>
  <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
  <script type="module" src="/js/app.js" th:src="@{/js/app.js}"></script>
</head>
<body>

  <div class="container" id="wrap">

    <div class="columns">

      <div class="column">
        <section class="panel">
          <h2 class="panel-heading">New questions</h2>
          <div id="new-questions"></div>
        </section>

        <section class="panel" id="answers-panel" hidden>
          <h2 class="panel-heading">Answers</h2>
          <div id="answers"></div>
        </section>
      </div>

      <div class="column">
        <section class="panel">
          <h2 class="panel-heading">HR Max</h2>
          <div class="panel-body" id="hrmax">Unknown</div>
        </section>

        <section class="panel" id="knowns-panel" hidden>
          <h2 class="panel-heading">Knowns</h2>
          <div class="panel-body">
            <ul class="rules" id="knowns"></ul>
          </div>
        </section>
      </div>

      <div class="column">
        <section class="panel" id="events-panel" hidden>
          <h2 class="panel-heading">Rule matches</h2>
          <div class="panel-body">
            <ul class="rules" id="events"></ul>
          </div>
        </section>
      </div>

    </div>

  </div>

</body>
</html>
